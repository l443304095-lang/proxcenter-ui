name: Build and Push Frontend Image

# 触发条件：当 main 分支的 frontend 目录有代码推入时，或者手动触发
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Ubuntu 云服务器

    # 赋予 GITHUB_TOKEN 推送镜像到 GitHub Container Registry 的权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend # 关键点：指定构建上下文为 frontend 目录
          file: frontend/Dockerfile # 关键点：指定 Dockerfile 的路径
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启缓存，加速下次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
